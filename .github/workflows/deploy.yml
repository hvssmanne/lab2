name: ML CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:

  train:
    runs-on: ubuntu-latest

    outputs:
      mse: ${{ steps.metrics.outputs.mse }}
      r2: ${{ steps.metrics.outputs.r2 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install jq and bc
      run: sudo apt-get install jq bc

    - name: Run training
      run: python train.py

    - name: Extract metrics
      id: metrics
      run: |
        MSE=$(jq '.MSE' outputs/results.json)
        R2=$(jq '.R2' outputs/results.json)
        echo "mse=$MSE" >> $GITHUB_OUTPUT
        echo "r2=$R2" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: outputs/


  deploy:
    needs: train
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: model-artifacts
        path: outputs/

    - name: Compare metrics
      id: compare
      run: |
        echo "Current MSE: ${{ needs.train.outputs.mse }}"
        echo "Best MSE: ${{ vars.BEST_MSE }}"

        if (( $(echo "${{ needs.train.outputs.mse }} < ${{ vars.BEST_MSE }}" | bc -l) )); then
          echo "improved=true" >> $GITHUB_OUTPUT
        else
          echo "improved=false" >> $GITHUB_OUTPUT
        fi

    - name: Stop if not improved
      if: steps.compare.outputs.improved == 'false'
      run: echo "2022BCS0134----Metric did not improve"

    - name: Login to Docker Hub
      if: steps.compare.outputs.improved == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      if: steps.compare.outputs.improved == 'true'
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/harshitha_2022bcs0134:latest .

    - name: Push Docker Image
      if: steps.compare.outputs.improved == 'true'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/harshitha_2022bcs0134:latest

    - name: Update BEST_MSE variable
      if: steps.compare.outputs.improved == 'true'
      run: |
        gh variable set BEST_MSE --body "${{ needs.train.outputs.mse }}"
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
